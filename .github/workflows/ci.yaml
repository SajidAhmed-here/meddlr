name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  Linting:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          make dev-lint

      - name: Lint with isort, black, docformatter, flake8
        run: make lint

  Build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.9"]
        torchmetrics-version: ["latest"]
        ignore-lpips: ["false"]
    env:
      TORCHMETRICS: ${{ matrix.torchmetrics-version }}
      IGNORE_LPIPS: ${{ matrix.ignore-lpips }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    name: py${{ matrix.python-version }}, torchmetrics-${{ matrix.torchmetrics-version }}, ignore-lpips-${{ matrix.ignore-lpips }}, ${{ matrix.os }}

    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install torch and torchmetrics
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          if [[ $TORCHMETRICS == "latest" || -z $TORCHMETRICS ]]; then
            pip install torchmetrics
          else
            pip install torchmetrics==$TORCHMETRICS
          fi

      - name: Install project (make dev)
        run: make dev

      - name: Install project extras
        run: |
          pip install -e '.[alldev]'
          if [[ $IGNORE_LPIPS == "true" ]]; then
            pip uninstall -y lpips
          fi

      - name: Show installed versions
        run: pip list | grep -i -E "torch|numpy|lpips|meddlr"

      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          MEDDLR_TEST_MODEL_ZOOS=True MEDDLR_TEST_DEPRECATED=True make test-cov

      - name: Upload to codecov.io
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
